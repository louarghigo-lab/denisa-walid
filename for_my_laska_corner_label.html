<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Water the Lily</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Sacramento&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    background: radial-gradient(circle at 50% 35%, #fff0f5 0%, #ffd6e7 48%, #ffb3d1 100%);
    font-family: 'Quicksand', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    position: relative;
  }

  /* Floating background hearts canvas */
  #heartsCanvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  /* Water droplets canvas */
  #waterCanvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 15;
  }

  /* Top prompt & progress */
  .hud {
    position: relative;
    z-index: 10;
    margin-top: 32px;
    padding: 0 16px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  #promptText {
    font-size: clamp(1.45rem, 3.4vw, 2.3rem);
    font-weight: 700;
    color: #b8295c;
    text-shadow: 0 2px 12px rgba(255, 255, 255, 0.92);
    letter-spacing: 0.4px;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .progress-wrap {
    width: 220px;
    max-width: 75vw;
    height: 10px;
    background: rgba(255, 255, 255, 0.68);
    border-radius: 999px;
    overflow: hidden;
    box-shadow: inset 0 1px 4px rgba(184, 41, 92, 0.18);
    backdrop-filter: blur(4px);
    transition: opacity 0.6s ease;
  }

  #progressBar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ff7eb3, #ff3d7f);
    border-radius: 999px;
    transition: width 0.08s linear;
  }

  /* Main Garden Stage */
  .stage {
    position: relative;
    z-index: 5;
    width: 100%;
    flex: 1;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 44px;
  }

  /* Plant container */
  .plant-zone {
    position: relative;
    width: 340px;
    max-width: 92vw;
    height: 430px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  /* Soft pink soil mound */
  .soil {
    position: absolute;
    bottom: 0;
    width: 230px;
    height: 46px;
    background:
      radial-gradient(circle at 28% 45%, #3d2415 2px, transparent 3px),
      radial-gradient(circle at 68% 38%, #4a2c1a 2.5px, transparent 3.5px),
      radial-gradient(circle at 52% 62%, #2e1a0e 2px, transparent 3px),
      radial-gradient(circle at 80% 58%, #6e452b 1.5px, transparent 2.5px),
      radial-gradient(circle at 20% 60%, #6e452b 1.5px, transparent 2.5px),
      radial-gradient(ellipse at 50% 30%, #7c5033 0%, #5c3821 55%, #3b2212 100%);
    border-radius: 50% 50% 46% 46% / 60% 60% 40% 40%;
    box-shadow:
      inset 0 4px 10px rgba(158, 108, 72, 0.35),
      inset 0 -8px 14px rgba(28, 15, 7, 0.55),
      0 10px 24px rgba(74, 42, 22, 0.32);
    z-index: 4;
  }

  /* Seed */
  #seed {
    position: absolute;
    bottom: 24px;
    width: 28px;
    height: 36px;
    background: radial-gradient(circle at 35% 30%, #ffd1e3, #c95b84 75%, #8f3557 100%);
    border-radius: 50% 50% 45% 45% / 65% 65% 35% 35%;
    z-index: 5;
    box-shadow: 0 4px 12px rgba(184, 41, 92, 0.35);
    transition: transform 0.75s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.6s ease;
  }

  /* Stem & Leaves SVG */
  #plantSvg {
    position: absolute;
    bottom: 28px;
    width: 320px;
    height: 380px;
    overflow: visible;
    z-index: 3;
    pointer-events: none;
  }

  #stemPath {
    stroke-dasharray: 260;
    stroke-dashoffset: 260;
    transition: stroke-dashoffset 1.4s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .leaf {
    transform-origin: 160px 260px;
    transform: scale(0);
    opacity: 0;
    transition: transform 1.1s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.8s ease;
  }

  .leaf-right {
    transform-origin: 160px 235px;
  }

  /* Lily Flower Head */
  #lilyHead {
    position: absolute;
    bottom: 225px;
    left: 50%;
    width: 310px;
    height: 310px;
    transform: translateX(-50%) scale(0);
    opacity: 0;
    z-index: 6;
    transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.8s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Detailed 6-petal lily SVG + stamens/pistil matching reference */
  #lilyArtwork {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0 12px 22px rgba(214, 92, 142, 0.25));
  }

  .lily-petal {
    transform-origin: 155px 185px;
    transform: rotate(0deg) scale(0.28, 0.72);
    opacity: 0.92;
    transition: transform 1.85s cubic-bezier(0.22, 1, 0.36, 1), opacity 1s ease;
  }

  /* Closed bud arrangement before full bloom */
  #lilyHead:not(.bloomed) .petal-top {
    transform: translate(0px, 24px) rotate(0deg) scale(0.34, 0.78);
  }
  #lilyHead:not(.bloomed) .petal-top-left {
    transform: translate(0px, 24px) rotate(-14deg) scale(0.32, 0.75);
  }
  #lilyHead:not(.bloomed) .petal-top-right {
    transform: translate(0px, 24px) rotate(14deg) scale(0.32, 0.75);
  }
  #lilyHead:not(.bloomed) .petal-mid-left {
    transform: translate(0px, 24px) rotate(-24deg) scale(0.3, 0.72);
  }
  #lilyHead:not(.bloomed) .petal-mid-right {
    transform: translate(0px, 24px) rotate(24deg) scale(0.3, 0.72);
  }
  #lilyHead:not(.bloomed) .petal-bottom {
    transform: translate(0px, 24px) rotate(6deg) scale(0.32, 0.74);
  }

  /* Open recurved bloom matching reference lily */
  #lilyHead.bloomed .petal-top {
    transform: translate(0px, -6px) rotate(0deg) scale(1);
  }
  #lilyHead.bloomed .petal-top-left {
    transform: translate(-12px, 4px) rotate(-26deg) scale(0.98);
  }
  #lilyHead.bloomed .petal-top-right {
    transform: translate(12px, 4px) rotate(26deg) scale(0.98);
  }
  #lilyHead.bloomed .petal-mid-left {
    transform: translate(-16px, 14px) rotate(-58deg) scale(0.96);
  }
  #lilyHead.bloomed .petal-mid-right {
    transform: translate(16px, 14px) rotate(58deg) scale(0.96);
  }
  #lilyHead.bloomed .petal-bottom {
    transform: translate(0px, 18px) rotate(12deg) scale(0.96);
  }

  .stamen-group {
    opacity: 0;
    transform: scale(0.35);
    transform-origin: 155px 182px;
    transition: opacity 1.3s ease 0.45s, transform 1.6s cubic-bezier(0.22, 1, 0.36, 1) 0.45s;
  }

  #lilyHead.bloomed .stamen-group {
    opacity: 1;
    transform: scale(1);
  }

  /* Glowing love message badge nestled gently over the bloom */
  #loveMessage {
    position: absolute;
    z-index: 12;
    top: 50%;
    left: 50%;
    width: min(300px, 84vw);
    padding: 14px 18px;
    border-radius: 26px;
    background: radial-gradient(circle at 50% 45%, rgba(214, 48, 108, 0.86) 0%, rgba(186, 32, 88, 0.82) 72%, rgba(235, 92, 145, 0.72) 100%);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1.5px solid rgba(255, 255, 255, 0.55);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    opacity: 0;
    transform: translate(-50%, -42%) scale(0.42);
    transition: opacity 1.4s ease 0.55s, transform 1.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.55s;
    box-shadow: 0 10px 32px rgba(184, 30, 86, 0.45), inset 0 0 18px rgba(255, 214, 231, 0.35);
    pointer-events: none;
  }

  #lilyHead.bloomed #loveMessage {
    opacity: 1;
    transform: translate(-50%, -48%) scale(1);
  }

  #loveMessage p {
    font-family: 'Quicksand', sans-serif;
    font-size: clamp(0.82rem, 2.2vw, 0.96rem);
    font-weight: 700;
    line-height: 1.45;
    color: #ffffff;
    text-shadow: 0 1px 6px rgba(130, 12, 56, 0.75);
    margin: 0;
  }

  #loveMessage p span.princess {
    font-size: 1.06em;
    letter-spacing: 0.6px;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.75), 0 1px 6px rgba(130, 12, 56, 0.8);
  }

  /* Animated Puppy Companion */
  #puppyCompanion {
    position: fixed;
    bottom: 26px;
    left: 18%;
    width: 112px;
    height: 118px;
    z-index: 9;
    pointer-events: none;
    transform-origin: 50% 90%;
    will-change: transform, left;
  }

  .puppy-rig {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    transition: transform 0.25s ease;
  }

  #puppyCompanion.facing-left .puppy-rig {
    transform: scaleX(-1);
  }

  .puppy-shadow {
    position: absolute;
    bottom: 2px;
    width: 74px;
    height: 14px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(140, 38, 76, 0.28) 0%, rgba(140, 38, 76, 0) 75%);
  }

  .puppy-body-wrap {
    position: relative;
    width: 96px;
    height: 104px;
    animation: puppyWalkBob 0.55s ease-in-out infinite alternate;
  }

  #puppyCompanion.running .puppy-body-wrap {
    animation: puppyRunBob 0.22s ease-in-out infinite alternate;
  }

  @keyframes puppyWalkBob {
    0% { transform: translateY(0px) rotate(-1.5deg); }
    100% { transform: translateY(-5px) rotate(1.5deg); }
  }

  @keyframes puppyRunBob {
    0% { transform: translateY(0px) rotate(-4deg) scaleY(0.96); }
    100% { transform: translateY(-12px) rotate(4deg) scaleY(1.04); }
  }

  /* Realistic custom dog head + optional live photo swap overlay */
  .dog-head-wrap {
    position: absolute;
    top: -12px;
    right: -8px;
    width: 78px;
    height: 78px;
    z-index: 5;
    filter: drop-shadow(0 4px 10px rgba(145, 45, 82, 0.25));
    transform-origin: 35% 75%;
    animation: puppyHeadTilt 1.6s ease-in-out infinite alternate;
  }

  #puppyCompanion.running .dog-head-wrap {
    animation: puppyHeadExcited 0.26s ease-in-out infinite alternate;
  }

  @keyframes puppyHeadTilt {
    0% { transform: rotate(-3deg); }
    100% { transform: rotate(4deg); }
  }

  @keyframes puppyHeadExcited {
    0% { transform: rotate(-6deg) translateY(0px); }
    100% { transform: rotate(7deg) translateY(-3px); }
  }

  .dog-custom-photo {
    position: absolute;
    top: 9px;
    left: 11px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    object-fit: cover;
    object-position: 50% 45%;
    border: 2.5px solid #fffafc;
    display: none;
    z-index: 6;
  }

  .dog-custom-photo.active {
    display: block;
  }

  /* Crisp bottom-right corner dedication label */
  .corner-dedication {
    position: fixed;
    bottom: 14px;
    right: 16px;
    z-index: 25;
    background: rgba(255, 255, 255, 0.78);
    color: #9e1b4b;
    border: 1px solid rgba(255, 182, 213, 0.85);
    border-radius: 999px;
    padding: 6px 13px;
    font-family: 'Quicksand', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.3px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 4px 12px rgba(184, 41, 92, 0.16);
    pointer-events: none;
  }

  .puppy-tail {
    transform-origin: 24px 66px;
    animation: tailWagSlow 0.45s ease-in-out infinite alternate;
  }

  #puppyCompanion.running .puppy-tail {
    animation: tailWagFast 0.14s ease-in-out infinite alternate;
  }

  @keyframes tailWagSlow {
    0% { transform: rotate(-14deg); }
    100% { transform: rotate(18deg); }
  }

  @keyframes tailWagFast {
    0% { transform: rotate(-28deg); }
    100% { transform: rotate(34deg); }
  }

  .paw-front-1, .paw-back-1 {
    transform-origin: 50% 76px;
    animation: pawStrideA 0.55s ease-in-out infinite alternate;
  }

  .paw-front-2, .paw-back-2 {
    transform-origin: 50% 76px;
    animation: pawStrideB 0.55s ease-in-out infinite alternate;
  }

  #puppyCompanion.running .paw-front-1,
  #puppyCompanion.running .paw-back-1 {
    animation: pawStrideA 0.2s ease-in-out infinite alternate;
  }

  #puppyCompanion.running .paw-front-2,
  #puppyCompanion.running .paw-back-2 {
    animation: pawStrideB 0.2s ease-in-out infinite alternate;
  }

  @keyframes pawStrideA {
    0% { transform: rotate(-18deg) translateY(0); }
    100% { transform: rotate(22deg) translateY(-3px); }
  }

  @keyframes pawStrideB {
    0% { transform: rotate(22deg) translateY(-3px); }
    100% { transform: rotate(-18deg) translateY(0); }
  }

  .puppy-emote {
    position: absolute;
    top: -16px;
    right: 4px;
    font-size: 0.95rem;
    opacity: 0;
    transform: translateY(4px) scale(0.7);
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
  }

  #puppyCompanion.running .puppy-emote {
    opacity: 1;
    transform: translateY(-4px) scale(1.1);
  }

  /* Draggable Watering Can */
  #wateringCan {
    position: fixed;
    top: 22%;
    right: 12%;
    width: 125px;
    height: 95px;
    cursor: grab;
    z-index: 20;
    touch-action: none;
    filter: drop-shadow(0 10px 18px rgba(184, 41, 92, 0.25));
    transition: transform 0.25s ease;
  }

  #wateringCan:active {
    cursor: grabbing;
  }

  #wateringCan.tilted {
    transform: rotate(-34deg) scale(1.05);
  }

  .hint-badge {
    position: absolute;
    bottom: -24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.88);
    color: #b8295c;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 4px 11px;
    border-radius: 999px;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(184, 41, 92, 0.15);
    pointer-events: none;
    transition: opacity 0.4s ease;
  }

  @media (max-width: 600px) {
    #wateringCan {
      top: 19%;
      right: 6%;
      width: 110px;
      height: 84px;
    }
    .plant-zone {
      height: 390px;
    }
    #lilyHead {
      bottom: 205px;
      width: 260px;
      height: 260px;
    }
    #loveMessage {
      width: min(275px, 86vw);
      padding: 12px 14px;
    }
    #loveMessage p {
      font-size: 0.78rem;
      line-height: 1.4;
    }
    #puppyCompanion {
      bottom: 20px;
      width: 96px;
      height: 102px;
    }
  }
</style>
</head>
<body>

  <canvas id="heartsCanvas"></canvas>
  <canvas id="waterCanvas"></canvas>

  <div class="hud">
    <div id="promptText">Water the lily 🌸</div>
    <div class="progress-wrap" id="progressWrap">
      <div id="progressBar"></div>
    </div>
  </div>

  <!-- Draggable Watering Can -->
  <div id="wateringCan" title="Drag me over the seed!">
    <svg viewBox="0 0 160 120" width="100%" height="100%">
      <!-- Handle -->
      <path d="M98 34 C135 20, 145 75, 106 82" fill="none" stroke="#ff5c97" stroke-width="10" stroke-linecap="round"/>
      <!-- Spout -->
      <path d="M58 72 L18 42 L12 49 L52 84 Z" fill="#ff75a8"/>
      <!-- Rose (sprinkler head) -->
      <ellipse cx="14" cy="45" rx="6" ry="12" transform="rotate(-36 14 45)" fill="#d93873"/>
      <!-- Body -->
      <rect x="48" y="36" width="62" height="58" rx="16" fill="url(#canGrad)"/>
      <!-- Rim -->
      <rect x="52" y="31" width="54" height="9" rx="4.5" fill="#ff4788"/>
      <!-- Cute Heart on Can -->
      <path d="M79 74 C79 74 64 64 64 55 C64 50 68 47 72 47 C75 47 78 49 79 52 C80 49 83 47 86 47 C90 47 94 50 94 55 C94 64 79 74 79 74 Z" fill="#fff0f6"/>
      <defs>
        <linearGradient id="canGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff9ec4"/>
          <stop offset="100%" stop-color="#ff5c97"/>
        </linearGradient>
      </defs>
    </svg>
    <div class="hint-badge" id="hintBadge">Drag me & pour 💕</div>
  </div>

  <div class="stage">
    <div class="plant-zone" id="plantZone">
      <!-- Growing Stem & Leaves -->
      <svg id="plantSvg" viewBox="0 0 320 380">
        <path id="stemPath" d="M160 365 Q154 275 160 175" fill="none" stroke="#5eb578" stroke-width="9" stroke-linecap="round"/>
        <path class="leaf" id="leafLeft" d="M158 265 C110 255, 88 225, 102 205 C122 212, 145 238, 158 265 Z" fill="#6cc987"/>
        <path class="leaf leaf-right" id="leafRight" d="M160 240 C208 230, 230 200, 216 180 C196 187, 173 213, 160 240 Z" fill="#58b372"/>
      </svg>

      <!-- Lily Flower (Bud -> Detailed Recurved Pink Lily Bloom) -->
      <div id="lilyHead">
        <svg id="lilyArtwork" viewBox="0 0 310 310" aria-label="Bloomed pink lily">
          <defs>
            <!-- Light pink & blush-white petal gradient with pale green-yellow throat -->
            <linearGradient id="lilyPetalGrad" x1="50%" y1="0%" x2="50%" y2="100%">
              <stop offset="0%" stop-color="#ffe8f1"/>
              <stop offset="22%" stop-color="#ffc3dc"/>
              <stop offset="58%" stop-color="#f79bc2"/>
              <stop offset="84%" stop-color="#ffd4e5"/>
              <stop offset="94%" stop-color="#e5f2b8"/>
              <stop offset="100%" stop-color="#c4dc88"/>
            </linearGradient>

            <!-- Soft highlight sheen along petal center -->
            <linearGradient id="petalHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
              <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
              <stop offset="100%" stop-color="#b84a77" stop-opacity="0.18"/>
            </linearGradient>

            <!-- Orange-brown anther gradient -->
            <linearGradient id="antherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#b85314"/>
              <stop offset="50%" stop-color="#8a3809"/>
              <stop offset="100%" stop-color="#5c2103"/>
            </linearGradient>

            <!-- Reusable detailed lily petal with longitudinal veins & dark-pink speckles -->
            <g id="detailedPetal">
              <path d="M155 186 C132 165, 114 115, 122 58 C126 30, 141 18, 155 14 C169 18, 184 30, 188 58 C196 115, 178 165, 155 186 Z"
                    fill="url(#lilyPetalGrad)" stroke="#df7ba4" stroke-width="1.2"/>
              <path d="M155 186 C132 165, 114 115, 122 58 C126 30, 141 18, 155 14 C169 18, 184 30, 188 58 C196 115, 178 165, 155 186 Z"
                    fill="url(#petalHighlight)"/>

              <!-- Subtle longitudinal veins -->
              <path d="M155 182 Q155 100 155 20" fill="none" stroke="#fff3f8" stroke-width="1.4" opacity="0.65"/>
              <path d="M152 180 Q138 115 134 38" fill="none" stroke="#c85a87" stroke-width="0.8" opacity="0.35"/>
              <path d="M158 180 Q172 115 176 38" fill="none" stroke="#c85a87" stroke-width="0.8" opacity="0.35"/>
              <path d="M148 176 Q128 125 125 74" fill="none" stroke="#c85a87" stroke-width="0.7" opacity="0.28"/>
              <path d="M162 176 Q182 125 185 74" fill="none" stroke="#c85a87" stroke-width="0.7" opacity="0.28"/>

              <!-- Delicate burgundy / dark-pink speckles near the lower-middle throat -->
              <circle cx="147" cy="144" r="1.35" fill="#7d1d43" opacity="0.78"/>
              <circle cx="153" cy="138" r="1.2" fill="#7d1d43" opacity="0.7"/>
              <circle cx="161" cy="142" r="1.4" fill="#7d1d43" opacity="0.76"/>
              <circle cx="143" cy="133" r="1.15" fill="#8f244e" opacity="0.68"/>
              <circle cx="165" cy="131" r="1.25" fill="#8f244e" opacity="0.72"/>
              <circle cx="150" cy="125" r="1.1" fill="#7d1d43" opacity="0.62"/>
              <circle cx="159" cy="122" r="1.1" fill="#7d1d43" opacity="0.6"/>
              <circle cx="145" cy="152" r="1.2" fill="#6b1638" opacity="0.72"/>
              <circle cx="163" cy="151" r="1.2" fill="#6b1638" opacity="0.7"/>
              <circle cx="155" cy="156" r="1.05" fill="#6b1638" opacity="0.65"/>
            </g>
          </defs>

          <!-- Back & side recurved petals -->
          <use href="#detailedPetal" class="lily-petal petal-mid-left"/>
          <use href="#detailedPetal" class="lily-petal petal-mid-right"/>
          <use href="#detailedPetal" class="lily-petal petal-top-left"/>
          <use href="#detailedPetal" class="lily-petal petal-top-right"/>
          <use href="#detailedPetal" class="lily-petal petal-top"/>

          <!-- Foreground lower recurved petal -->
          <use href="#detailedPetal" class="lily-petal petal-bottom"/>

          <!-- Pale greenish-yellow inner throat & curving stamens + central pistil -->
          <g class="stamen-group">
            <ellipse cx="155" cy="186" rx="22" ry="14" fill="#e6f2b5" opacity="0.88"/>

            <!-- Filaments -->
            <path d="M153 185 Q132 135 122 86" fill="none" stroke="#f7eed2" stroke-width="2.6" stroke-linecap="round"/>
            <path d="M155 185 Q145 125 144 68" fill="none" stroke="#f7eed2" stroke-width="2.6" stroke-linecap="round"/>

<script>
  /* ---------------- 1. FLOATING HEARTS BACKGROUND ---------------- */
  const heartsCanvas = document.getElementById('heartsCanvas');
  const hCtx = heartsCanvas.getContext('2d');
  const waterCanvas = document.getElementById('waterCanvas');
  const wCtx = waterCanvas.getContext('2d');
  let hearts = [];

  function resizeCanvases() {
    heartsCanvas.width = window.innerWidth;
    heartsCanvas.height = window.innerHeight;
    waterCanvas.width = window.innerWidth;
    waterCanvas.height = window.innerHeight;
  }

  class FloatingHeart {
    constructor(randomY = false) {
      this.reset(randomY);
    }
    reset(randomY = false) {
      this.x = Math.random() * heartsCanvas.width;
      this.y = randomY ? Math.random() * heartsCanvas.height : heartsCanvas.height + 30;
      this.size = 10 + Math.random() * 18;
      this.speedY = 0.5 + Math.random() * 1.1;
      this.sway = Math.random() * Math.PI * 2;
      this.swaySpeed = 0.015 + Math.random() * 0.02;
      this.alpha = 0.22 + Math.random() * 0.42;
      const pinks = ['#ff7eb3', '#ff4d8d', '#ff9ec4', '#ffffff', '#ff2a75'];
      this.color = pinks[Math.floor(Math.random() * pinks.length)];
    }
    update(boost = 1) {
      this.y -= this.speedY * boost;
      this.sway += this.swaySpeed;
      this.x += Math.sin(this.sway) * 0.6;
      if (this.y < -40) this.reset(false);
    }
    draw() {
      hCtx.save();
      hCtx.translate(this.x, this.y);
      hCtx.globalAlpha = this.alpha;
      hCtx.fillStyle = this.color;
      const s = this.size / 15;
      hCtx.scale(s, s);
      hCtx.beginPath();
      hCtx.moveTo(0, 6);
      hCtx.bezierCurveTo(-12, -4, -18, -14, -8, -18);
      hCtx.bezierCurveTo(-2, -20, 0, -14, 0, -12);
      hCtx.bezierCurveTo(0, -14, 2, -20, 8, -18);
      hCtx.bezierCurveTo(18, -14, 12, -4, 0, 6);
      hCtx.fill();
      hCtx.restore();
    }
  }

  /* ---------------- 2. WATERING CAN DRAG & DROPLETS ---------------- */
  const can = document.getElementById('wateringCan');
  const hintBadge = document.getElementById('hintBadge');
  const plantZone = document.getElementById('plantZone');
  const promptText = document.getElementById('promptText');
  const progressBar = document.getElementById('progressBar');
  const progressWrap = document.getElementById('progressWrap');

  const seed = document.getElementById('seed');
  const stemPath = document.getElementById('stemPath');
  const leafLeft = document.getElementById('leafLeft');
  const leafRight = document.getElementById('leafRight');
  const lilyHead = document.getElementById('lilyHead');
  const puppyCompanion = document.getElementById('puppyCompanion');

  resizeCanvases();
  window.addEventListener('resize', resizeCanvases);

  for (let i = 0; i < 34; i++) hearts.push(new FloatingHeart(true));

  /* Puppy autonomous walk/run state */
  let dogX = Math.max(24, window.innerWidth * 0.16);
  let dogDir = 1; // 1 = right, -1 = left
  let dogSparkleTimer = 0;

  let isDragging = false;
  let offsetX = 0;
  let offsetY = 0;
  let droplets = [];
  let waterSeconds = 0;
  let sprouted = false;
  let bloomed = false;
  let lastFrameTime = performance.now();

  function startDrag(clientX, clientY) {
    isDragging = true;
    hintBadge.style.opacity = '0';
    const rect = can.getBoundingClientRect();
    offsetX = clientX - rect.left;
    offsetY = clientY - rect.top;
  }

  function moveDrag(clientX, clientY) {
    if (!isDragging) return;
    const x = Math.max(0, Math.min(window.innerWidth - can.offsetWidth, clientX - offsetX));
    const y = Math.max(0, Math.min(window.innerHeight - can.offsetHeight, clientY - offsetY));
    can.style.left = x + 'px';
    can.style.top = y + 'px';
    can.style.right = 'auto';
  }

  function endDrag() {
    isDragging = false;
    can.classList.remove('tilted');
  }

  can.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
  window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
  window.addEventListener('mouseup', endDrag);

  can.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    startDrag(t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    const t = e.touches[0];
    moveDrag(t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener('touchend', endDrag);

  function spawnDroplet(spoutX, spoutY) {
    droplets.push({
      x: spoutX + (Math.random() - 0.5) * 10,
      y: spoutY + (Math.random() - 0.5) * 6,
      vx: -1.6 - Math.random() * 1.4,
      vy: 2.5 + Math.random() * 2,
      r: 3 + Math.random() * 2.5,
      alpha: 0.95
    });
  }

  /* ---------------- 3. ANIMATION & GROWTH TIMELINE (4.5s -> 9s) ---------------- */
  function animate(now) {
    const dt = Math.min(0.1, (now - lastFrameTime) / 1000);
    lastFrameTime = now;

    // Draw floating hearts
    hCtx.clearRect(0, 0, heartsCanvas.width, heartsCanvas.height);
    const heartSpeedBoost = bloomed ? 1.8 : 1;
    hearts.forEach(h => {
      h.update(heartSpeedBoost);
      h.draw();
    });

    // Check if watering can is held above the plant zone
    const canRect = can.getBoundingClientRect();
    const plantRect = plantZone.getBoundingClientRect();
    const canCenterX = canRect.left + canRect.width * 0.4;
    const canCenterY = canRect.top + canRect.height * 0.5;

    const isOverPlant =
      isDragging &&
      canCenterX > plantRect.left - 40 &&
      canCenterX < plantRect.right + 80 &&
      canCenterY < plantRect.bottom - 60;

    const isActivelyWatering = isOverPlant && !bloomed;

    /* ---------------- UPDATE PUPPY WALK / EXCITED RUN ---------------- */
    const dogWidth = puppyCompanion.offsetWidth || 112;
    const minDogX = 16;
    const maxDogX = Math.max(minDogX + 40, window.innerWidth - dogWidth - 16);

    if (isActivelyWatering) {
      puppyCompanion.classList.add('running');
    } else {
      puppyCompanion.classList.remove('running');
    }

    // Walk calmly normally (58 px/s), zoom around excitedly when watering (235 px/s), or happy trot after bloom (115 px/s)
    const dogSpeed = isActivelyWatering ? 235 : (bloomed ? 115 : 58);
    dogX += dogDir * dogSpeed * dt;

    if (dogX >= maxDogX) {
      dogX = maxDogX;
      dogDir = -1;
    } else if (dogX <= minDogX) {
      dogX = minDogX;
      dogDir = 1;
    }

    puppyCompanion.style.left = dogX + 'px';
    if (dogDir === -1) {
      puppyCompanion.classList.add('facing-left');
    } else {
      puppyCompanion.classList.remove('facing-left');
    }

    // Spawn little floating love hearts from the excited puppy while running
    if (isActivelyWatering) {
      dogSparkleTimer += dt;
      if (dogSparkleTimer >= 0.28) {
        dogSparkleTimer = 0;
        const pupHeart = new FloatingHeart(false);
        pupHeart.x = dogX + dogWidth * 0.5 + (Math.random() - 0.5) * 24;
        pupHeart.y = window.innerHeight - 115;
        pupHeart.size = 9 + Math.random() * 7;
        pupHeart.speedY = 1.2 + Math.random() * 0.8;
        hearts.push(pupHeart);
      }
    }

    if (isActivelyWatering) {
      can.classList.add('tilted');
      // Emit water droplets from the tilted spout tip
      const spoutX = canRect.left + 14;
      const spoutY = canRect.top + 56;
      spawnDroplet(spoutX, spoutY);
      spawnDroplet(spoutX, spoutY);

      // Accumulate watering time smoothly (9 seconds total)
      waterSeconds = Math.min(9, waterSeconds + dt);
      progressBar.style.width = ((waterSeconds / 9) * 100).toFixed(1) + '%';

      // At 4.5 seconds: Seed transforms into the Lily bud
      if (waterSeconds >= 4.5 && !sprouted) {
        sprouted = true;
        seed.style.transform = 'scale(0)';
        seed.style.opacity = '0';
        stemPath.style.strokeDashoffset = '0';
        leafLeft.style.transform = 'scale(1)';
        leafLeft.style.opacity = '1';
        leafRight.style.transform = 'scale(1)';
        leafRight.style.opacity = '1';
        lilyHead.style.transform = 'translateX(-50%) scale(1)';
        lilyHead.style.opacity = '1';
        promptText.textContent = 'Keep watering to open the lily... 🌸';
      }

      // At 9 total seconds: Lily opens smoothly & reveals the love note inside
      if (waterSeconds >= 9 && !bloomed) {
        bloomed = true;
        can.classList.remove('tilted');
        lilyHead.classList.add('bloomed');
        promptText.textContent = 'For you 💖';
        progressWrap.style.opacity = '0';

        // Burst of extra celebratory hearts
        for (let i = 0; i < 26; i++) {
          const burst = new FloatingHeart(false);
          burst.x = plantRect.left + plantRect.width / 2 + (Math.random() - 0.5) * 180;
          burst.y = plantRect.top + 170;
          burst.speedY = 1.4 + Math.random() * 1.8;
          hearts.push(burst);
        }
      }
    } else {
      can.classList.remove('tilted');
    }

    // Update & render water droplets
    wCtx.clearRect(0, 0, waterCanvas.width, waterCanvas.height);
    for (let i = droplets.length - 1; i >= 0; i--) {
      const d = droplets[i];
      d.x += d.vx;
      d.y += d.vy;
      d.vy += 0.22;
      d.alpha -= 0.015;

      wCtx.save();
      wCtx.globalAlpha = Math.max(0, d.alpha);
      wCtx.fillStyle = '#7cd4ff';
      wCtx.beginPath();
      wCtx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      wCtx.fill();
      wCtx.restore();

      if (d.y > plantRect.bottom - 20 || d.alpha <= 0) {
        droplets.splice(i, 1);
      }
    }

    requestAnimationFrame(animate);
  }

  window.onload = function () {
    requestAnimationFrame(animate);
  };
</script>
